<!DOCTYPE html><html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  *{margin:0;padding:0;box-sizing:border-box} html,body{width:100%;height:100%}
  body{background:#0F3F8F;background-image:linear-gradient(157deg,#14509F 0%,#0F3F8F 46%,#0A2C66 100%);color:#fff;
       font-family:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;
       justify-content:center;text-align:center;padding:60px;animation:fadein 1.2s ease-out}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .mark{width:110px;height:110px;margin-bottom:36px}
  .kicker{font-size:20px;letter-spacing:.28em;text-transform:uppercase;color:#BFD3F5;margin-bottom:22px}
  h1{font-size:64px;line-height:1.12;font-weight:700;max-width:1200px}
  h1 span{color:#7FB0F5}
  p{margin-top:26px;font-size:26px;color:#D7E4F8;max-width:980px;line-height:1.4}
  .bar{width:96px;height:6px;background:#6C4FD8;border-radius:3px;margin:38px auto 0}
  .foot{position:absolute;bottom:44px;font-size:18px;color:#BFD3F5;letter-spacing:.08em}
</style></head><body>
  <svg class="mark" viewBox="0 0 24 24" fill="#fff"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/></svg>
  <div class="kicker">Farmacia Guadalupe, C.A.</div>
  <h1>Sistema de <span>indicadores</span><br>recorrido completo</h1>
  <p>Panel · Cargar día · Mes · Gráficas · Metas · Año · Tasa BCV · Importar · Administración · Ayuda</p>
  <div class="bar"></div>
  <div class="foot">Datos de prueba · versión de demostración</div>
</body></html>
